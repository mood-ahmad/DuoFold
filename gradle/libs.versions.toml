[versions]
agp = "9.1.1"
kotlin = "2.4.0"
cmp = "1.11.1"
material3 = "1.9.0"
activity = "1.13.0"
nav3 = "1.1.4"
navigationevent = "1.1.2"
collection = "1.6.0"
lifecycle = "2.11.0"
serializationJson = "1.11.0"
serializationPlugin = "2.4.0"
materialkolor = "5.0.0"
libsu = "6.0.0"
coroutines = "1.10.2"
kyantShapes = "1.2.1"
jetbrainsAnnotations = "26.1.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "serializationPlugin" }

[libraries]
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "cmp" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "cmp" }
compose-ui-graphics = { module = "org.jetbrains.compose.ui:ui-graphics", version.ref = "cmp" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "cmp" }
compose-material3-windowsize = { module = "org.jetbrains.compose.material3:material3-window-size-class", version.ref = "material3" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-collection = { module = "androidx.collection:collection", version.ref = "collection" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3" }
androidx-navigationevent-compose = { module = "androidx.navigationevent:navigationevent-compose", version.ref = "navigationevent" }
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

materialkolor-utilities = { module = "com.materialkolor:material-color-utilities", version.ref = "materialkolor" }
libsu-core = { module = "com.github.topjohnwu.libsu:core", version.ref = "libsu" }
kyant-shapes = { module = "io.github.kyant0:shapes", version.ref = "kyantShapes" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrainsAnnotations" }
