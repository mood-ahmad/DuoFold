
name: Android CI

'on':
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          bash -n gradlew

      - name: Build and test DuoFold
        shell: bash
        run: |
          bash ./gradlew --no-daemon \
            :app:assembleStandardDebug \
            :app:assembleCompatDebug \
            :motion:test

      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DuoFold-debug-APKs
          path: |
            app/build/outputs/apk/standard/debug/*.apk
            app/build/outputs/apk/compat/debug/*.apk
          if-no-files-found: error
          retention-days: 7
