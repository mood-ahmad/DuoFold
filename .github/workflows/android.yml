
name: Android CI

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          bash -n gradlew

      - name: Build and test DuoFold
        shell: bash
        run: |
          bash ./gradlew --no-daemon \
            :app:assembleStandardDebug \
            :app:assembleCompatDebug \
            :motion:test

      - name: Locate generated APKs
        if: success()
        shell: bash
        run: |
          echo "Searching for APK files..."
          find . -type f -name "*.apk" -print | tee /tmp/apk-files.txt

          if [ ! -s /tmp/apk-files.txt ]; then
            echo "::error::No APK files were generated."
            exit 1
          fi

      - name: Upload APK files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DuoFold-APKs
          path: |
            **/*.apk
          if-no-files-found: error
          retention-days: 7
